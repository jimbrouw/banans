[project]
name = "roughcut-engine"
version = "0.1.0"
description = "Local companion service for the RoughCut Premiere panel: transcription and silence detection, no cloud."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mlx-whisper>=0.4",
]

[project.scripts]
roughcut-engine = "roughcut_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a whisper model and runs real transcription (set RC_ENGINE_SLOW=1)"]
